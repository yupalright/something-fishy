/* ------------------------------------------------------------ camera sway */
// The environment is anchored to the cursor: the camera drifts with it, so the
// title, doorway, spill, fish and bones all shift together — with a little
// parallax between them, since they're at different depths.
const camBase = camera.position.clone();
const camSway = new THREE.Vector2(0, 0);
// Door centre is about (2.26, 1.84). A straight line from the start would drift
// sideways the whole way, which reads as sliding in at an angle. Curving through
// a control point out to the right instead means the camera lines itself up
// early and the last stretch is square to the opening — like walking through it.
const CAM_END  = new THREE.Vector3(2.26, 1.86, -6.6);
const CAM_CTRL = new THREE.Vector3(3.05, 2.2, 2.0);
const LOOK_END = new THREE.Vector3(2.26, 1.84, -12);
const _bez = new THREE.Vector3();
const _look = new THREE.Vector3();
function updateCamera(dt){
  if (cityMode) return;
  // he stays put; the camera pushes past his shoulder and out through the door
  if (lit && litT > CONFIG.flow.cam){
    const u = Math.min((litT - CONFIG.flow.cam) / (CONFIG.flow.end - CONFIG.flow.cam), 1);
    const e = u * u * (3 - 2 * u);
    // carry whatever cursor offset was on screen when the push started and bleed
    // it out across the move — otherwise the handover snaps by the sway amount
    camSway.multiplyScalar(Math.max(0, 1 - dt * 0.9));
    const k = 1 - e;
    const iv = 1 - e;                       // quadratic bezier through CAM_CTRL
    _bez.set(
      iv*iv*camBase.x + 2*iv*e*CAM_CTRL.x + e*e*CAM_END.x,
      iv*iv*camBase.y + 2*iv*e*CAM_CTRL.y + e*e*CAM_END.y,
      iv*iv*camBase.z + 2*iv*e*CAM_CTRL.z + e*e*CAM_END.z
    );
    camera.position.copy(_bez);
    camera.position.x += camSway.x * k;
    camera.position.y += camSway.y * k;
    // aim down the axis of the doorway well before arriving, so the opening
    // sits centred in frame the whole way in rather than sliding into place
    _look.copy(camLook).lerp(LOOK_END, Math.pow(e, 0.5));
    camera.lookAt(_look.x + camSway.x * 0.55 * k,
                  _look.y + camSway.y * 0.55 * k,
                  _look.z);
    return;
  }
  const tx = pointerOn ? _ndc.x : 0;
  const ty = pointerOn ? _ndc.y : 0;
  const k = Math.min(1, dt * CONFIG.parallax.ease);
  camSway.x += (tx * CONFIG.parallax.x - camSway.x) * k;
  camSway.y += (ty * CONFIG.parallax.y - camSway.y) * k;
  camera.position.set(camBase.x + camSway.x, camBase.y + camSway.y, camBase.z);
  camera.lookAt(camLook.x + camSway.x * 0.55, camLook.y + camSway.y * 0.55, camLook.z);
}

/* ------------------------------------------------------------------- grain */
(function grain(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d'), img = g.createImageData(s, s);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 110 + Math.random() * 70;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const el = document.getElementById('grain');
  el.style.backgroundImage = `url(${c.toDataURL()})`;
  if (!reduced){
    setInterval(() => {
      el.style.backgroundPosition = `${(Math.random()*128)|0}px ${(Math.random()*128)|0}px`;
    }, 80);
  }
})();

/* -------------------------------------------------------------------- music */
// Slow kit, wandering piano drowned in reverb, a horn that turns up when it
// feels like it. All synthesised — no audio files, so this stays one file.
// Browsers won't start audio without a gesture, so nothing runs until the sound
// button or the screen is touched.
const Music = (function(){
  let ctx = null, master = null, verb = null, noiseBuf = null, timer = null;
  let nextTime = 0, i = 0, pianoAt = 0, hornAt = 26, note = 14, live = false;
  let sparse = false, lively = false, ambOn = false;
  let rainBuf = null, rainGain = null, rainBase = 0.085;

  const BPM = 46, EIGHTH = 30 / BPM, ROOT = 146.83;   // D3
  const PROG = [0, 0, 5, 7];                          // Dm Dm Gm A
  const hz = st => ROOT * Math.pow(2, st / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function noise(){
    if (noiseBuf) return noiseBuf;
    const n = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let k = 0; k < n; k++) d[k] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  function longNoise(){            // a four second bed, so the rain doesn't loop audibly
    if (rainBuf) return rainBuf;
    const n = ctx.sampleRate * 4;
    rainBuf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = rainBuf.getChannelData(c);
      for (let k = 0; k < n; k++) d[k] = Math.random() * 2 - 1;
    }
    return rainBuf;
  }

  function reverb(){
    const len = Math.floor(ctx.sampleRate * 4.2);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let k = 0; k < len; k++){
        d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2.2);
      }
    }
    const cv = ctx.createConvolver();
    cv.buffer = buf;
    return cv;
  }

  // every voice decides its own dry/wet split — the piano sits almost entirely
  // in the reverb, the kit stays close
  function out(node, dry, wet){
    const d = ctx.createGain(); d.gain.value = dry; node.connect(d); d.connect(master);
    const w = ctx.createGain(); w.gain.value = wet; node.connect(w); w.connect(verb);
  }

  function kick(t, vol){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(125, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    o.connect(g); out(g, 1, 0.12);
    o.start(t); o.stop(t + 0.5);
  }

  function snare(t, vol){
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise(); src.playbackRate.value = 0.8;
    f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.28);
    src.connect(f); f.connect(g); out(g, 1, 0.28);
    src.start(t); src.stop(t + 0.32);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(215, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.1);
    og.gain.setValueAtTime(vol * 0.5, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    o.connect(og); out(og, 1, 0.2);
    o.start(t); o.stop(t + 0.22);
  }

  function pianoNote(t, freq, vol){
    const dur = 2.4 + 130 / freq;
    const amps = [1, 0.4, 0.15, 0.055];
    [1, 2, 3, 4.2].forEach((mult, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = k === 0 ? 'triangle' : 'sine';
      o.frequency.value = freq * mult * (1 + 0.0015 * k);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol * amps[k], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0006, t + dur / (1 + k * 0.55));
      o.connect(g); out(g, 0.5, 0.95);
      o.start(t); o.stop(t + dur + 0.15);
    });
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise();
    f.type = 'bandpass'; f.frequency.value = freq * 3; f.Q.value = 2;
    g.gain.setValueAtTime(vol * 0.22, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06);
    src.connect(f); f.connect(g); out(g, 0.5, 0.45);
    src.start(t); src.stop(t + 0.1);
  }

  function pad(t, st, dur){
    [0, 7, 12].forEach((iv, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = k === 2 ? 'sine' : 'triangle';
      o.frequency.value = hz(st + iv - 12) * (k === 1 ? 1.002 : 1);
      const a = 0.06 * (1 - k * 0.28);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(a, t + 0.7);      // swells in fast — there's no time
      g.gain.linearRampToValueAtTime(a * 0.7, t + dur * 0.72);
      g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); out(g, 0.45, 0.95);
      o.start(t); o.stop(t + dur + 0.3);
    });
  }

  function horn(t, freq, dur, vol){
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = o2.type = 'sawtooth'; o2.detune.value = 9;
    [o1, o2].forEach(o => {
      o.frequency.setValueAtTime(freq * 0.975, t);
      o.frequency.linearRampToValueAtTime(freq, t + 0.13);
    });
    f.type = 'lowpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(freq * 1.2, t);
    f.frequency.linearRampToValueAtTime(freq * 5, t + dur * 0.35);
    f.frequency.linearRampToValueAtTime(freq * 2, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.16);
    g.gain.linearRampToValueAtTime(vol * 0.8, t + dur * 0.75);
    g.gain.linearRampToValueAtTime(0, t + dur + 0.28);
    o1.connect(f); o2.connect(f); f.connect(g); out(g, 0.6, 0.85);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.35); o2.stop(t + dur + 0.35);
  }

  function schedule(n, t){
    const bar = Math.floor(n / 8), beat = n % 8;
    const root = PROG[bar % 4];

    // down in the street the band drops away — just the drone, and a horn from
    // somewhere across the water
    if (sparse){
      if (beat === 0 && bar % 2 === 0) pad(t, root, EIGHTH * 16 * 1.05);
      if (n >= hornAt){
        horn(t, hz(root + 3), EIGHTH * 5, 0.055);
        horn(t + EIGHTH * 5.2, hz(root - 4), EIGHTH * 7, 0.045);
        hornAt = n + 120 + Math.round(Math.random() * 200);
      }
      return;
    }

    // a sustained chord under every bar — this is what keeps it from turning
    // into a jazz number. Drone first, everything else on top of it.
    if (beat === 0){
      pad(t, root, EIGHTH * 8 * 1.06);
      if (Math.random() < 0.8) kick(t, 0.4);
    }
    if (lively){                                  // brighter room, busier kit
      if (beat % 2 === 0) kick(t, beat === 0 ? 0.46 : 0.3);
      if (beat === 2 || beat === 6) snare(t, 0.13);
      else snare(t, 0.03);
      if (beat % 2 === 0){                        // walking bass under it
        const walk = [root, root + 7, root + 12, root + 5];
        pianoNote(t, hz(walk[(beat / 2) | 0] - 24), 0.2);
      }
    }
    else if (beat === 6) snare(t, 0.09);
    else if (beat === 2 && Math.random() < 0.3) snare(t, 0.05);
    else if (beat % 2 === 1 && Math.random() < 0.1) snare(t, 0.016);

    if (beat === 0 && bar % 4 === 0){                       // low voicing, rarely
      [root - 12, root - 5].forEach((st, k) => pianoNote(t + k * 0.03, hz(st), 0.12));
    }

    // There are only a few seconds to set a mood, so it opens on a stated
    // phrase and only then wanders off.
    if (n < 13){
      const OPEN = { 0: 19, 2: 15, 5: 12, 9: 20 };     // A, F, D, then the ninth
      if (OPEN[n] !== undefined){ note = OPEN[n]; pianoNote(t, hz(note), 0.21); }
      pianoAt = 13;
    }

    // After that: no figure, no phrase that repeats. Wide leaps, long gaps, and
    // the ninth and flat sixth left hanging without resolving.
    if (n >= pianoAt){
      const COLOUR = [0, 2, 3, 5, 7, 8, 10, 14, 15];
      const cands = COLOUR.map(v => v + 12).concat(COLOUR.map(v => v + 24));
      const reach = Math.random() < 0.3 ? 11 : 5;
      const near = cands.filter(v => { const d = Math.abs(v - note); return d > 0 && d <= reach; });
      note = near.length ? pick(near) : 15;
      pianoNote(t, hz(note), 0.14 + Math.random() * 0.06);
      pianoAt = n + (lively ? Math.round(rnd(1, 4))
                            : (Math.random() < 0.12 ? 1 : Math.round(rnd(5, 15))));
    }

    if (n >= hornAt){                                        // a fall, not a riff
      const base = root + 12;
      horn(t, hz(base + 3), EIGHTH * 4, 0.08);
      horn(t + EIGHTH * 4.2, hz(base), EIGHTH * 6, 0.065);
      hornAt = n + 96 + Math.round(Math.random() * 160);
    }
  }

  function tick(){
    if (!live) return;
    if (fight || ctx.currentTime < fightResume){        // the battle has the floor
      nextTime = Math.max(ctx.currentTime + 0.1, fightResume);
      return;
    }
    while (nextTime < ctx.currentTime + 0.4){
      schedule(i, nextTime);
      nextTime += EIGHTH;
      i++;
    }
  }


  /* ---- the mech battle: the one fast thing in the score ---- */
  // 172 bpm in E minor, Em C D B. Its own bus, mostly dry, so it can be cut
  // dead on the slam while the reverb tails ring out under the rain.
  let fight = false, fightResume = 0, bBus = null, bTimer = null;
  let bNext = 0, bStep = 0, bPhase = 'intro', shaper = null;
  const BBPM = 172, SIX = 15 / BBPM, BROOT = 82.41;      // E2
  const bhz = st => BROOT * Math.pow(2, st / 12);
  const BPROG = [[0, 3], [-4, 4], [-2, 4], [-5, 4]];      // root, third
  const BMEL = [                                          // [16th, semitone, length]
    [0, 31, 4], [4, 34, 2], [6, 36, 2], [8, 38, 6], [14, 36, 2],
    [16, 39, 4], [20, 38, 2], [22, 36, 2], [24, 36, 8],
    [32, 38, 4], [36, 36, 2], [38, 34, 2], [40, 34, 6], [46, 31, 2],
    [48, 35, 6], [54, 38, 2], [56, 43, 8]
  ];

  function bOut(node, dry, wet){
    const d = ctx.createGain(); d.gain.value = dry; node.connect(d); d.connect(bBus);
    if (wet){ const w = ctx.createGain(); w.gain.value = wet; node.connect(w); w.connect(verb); }
  }
  function bKick(t, v){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.09);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
    o.connect(g); bOut(g, 1, 0);
    o.start(t); o.stop(t + 0.3);
  }
  function bSnare(t, v){
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise();
    f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.6;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    src.connect(f); f.connect(g); bOut(g, 1, 0.12);
    src.start(t); src.stop(t + 0.2);
    const o = ctx.createOscillator(), og = ctx.createGain();

        g.gain.exponentialRampToValueAtTime(0.0005, t + off + 0.08);
        o.connect(g); out(g, 1, 0.2);
        o.start(t + off); o.stop(t + off + 0.1);
      });
    },
    // the grab: everything stops for a second
    grab(){
      if (!ctx || !live) return;
      const t = ctx.currentTime + 0.01;
      kick(t, 1.2);
      if (fight) bCrash(t, 0.35);
      horn(t, hz(-9), 0.5, 0.12);
    },
    toggle(){
      if (!ctx){ this.start(); return true; }
      const on = master.gain.value > 0.01;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(on ? 0 : 0.36, ctx.currentTime + 0.5);
      if (!on && ctx.state === 'suspended') ctx.resume();
      return !on;
    }
  };
})();

const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  const on = Music.toggle();
  soundBtn.textContent = on ? 'Sound off' : 'Sound on';
  soundBtn.setAttribute('aria-pressed', String(on));
});

/* ---------------------------------------------------------------- sequence */
// Nothing happens until the lighter is struck. Tapping raises the zippo to the
// cigarette, the cigarette catches, the music comes up and the room goes from a
// dim ember to full contrast. It idles there.
let lit = false, litT = 0, emerFlash = 0, bright = 0;
const CATCH = 0.62;                                  // tap -> cigarette catches
const ZIPPO_UP = new THREE.Vector3(1.0, -0.35, zippoHome.z + 0.04);

function ignite(){
  if (lit) return;
  lit = true; litT = 0;
  Music.start();
  if (soundBtn.textContent === 'Sound on'){
    soundBtn.textContent = 'Sound off';
    soundBtn.setAttribute('aria-pressed', 'true');
  }
  uiEl.style.opacity = '0';
  setTimeout(() => {
    flashEl.style.transition = 'opacity .05s ease';
    flashEl.style.opacity = '0.38';
    setTimeout(() => {
      flashEl.style.transition = 'opacity .7s ease';
      flashEl.style.opacity = '0';
    }, 70);
  }, CATCH * 1000);
}
stage.addEventListener('click', ignite);
if (new URLSearchParams(window.location.search).has('uptown')){
  stage.addEventListener('click', function jump(){
    stage.removeEventListener('click', jump);
    mechMode = new URLSearchParams(window.location.search).has('mech');
    litT = FLOW.hold + FLOW.fade + 1;
    bright = 1;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0';
    enterCity();
    cityUI.style.display = 'none';
    enterCorner();
    enterUptown();
  });
}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); ignite(); resumeSave(); }
});
// ?load=CODE: the first tap (or key) lights up and goes straight to the save
function resumeSave(){
  if (!PENDING_LOAD || resumeSave.done) return;
  resumeSave.done = true;
  jumpTo(PENDING_LOAD);
  try {                                   // a refresh from here starts fresh
    const qs = new URLSearchParams(window.location.search);
    qs.delete('load');
    const rest = qs.toString();
    history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : ''));
  } catch (err){ /* sandboxed: the address just keeps the code */ }
}
stage.addEventListener('click', resumeSave);

// hover feedback so the lighter reads as the thing to hit
const _zhit = new THREE.Raycaster();
function hoverZippo(){
  if (lit){ stage.style.cursor = 'default'; return; }
  _zhit.setFromCamera(_ndc, camera);
  const hit = _zhit.intersectObject(zippo, true).length > 0;
  stage.style.cursor = hit ? 'pointer' : 'default';
  const want = ZIPPO_SCALE * (hit ? 1.15 : 1);
  zippoScale += (want - zippoScale) * 0.12;      // eases up rather than snapping
  zippo.scale.setScalar(zippoScale);
}

function updateZippo(dt){
  if (!lit){
    // holds its mark, but bobs hard enough to read as the thing to press
    const b = Math.sin(elapsed * 2.6);
    zippo.position.set(zippoHome.x, zippoHome.y + b * 0.14, zippoHome.z);
    zippo.rotation.z = -0.12 + Math.sin(elapsed * 1.9) * 0.1;
    hoverZippo();
    return;
  }
  zippoScale += (ZIPPO_SCALE - zippoScale) * 0.12;
  zippo.scale.setScalar(zippoScale);
  const t = litT;                    // advanced by updateFlow
  const rise = smooth(Math.min(t / 0.42, 1));
  const sink = t > 1.5 ? smooth(Math.min((t - 1.5) / 1.0, 1)) : 0;
  zippo.position.lerpVectors(zippoHome, ZIPPO_UP, rise);
  zippo.position.y -= sink * 1.9;
  zippo.rotation.z = -0.12 * (1 - rise);

  zHinge.rotation.z = t < 1.3
    ? LID_HALF + (LID_OPEN - LID_HALF) * Math.min(t / 0.3, 1)
    : LID_OPEN * Math.max(0, 1 - (t - 1.3) / 0.3);   // flips wide, then snaps shut

  const flameOn = t > 0.26 && t < 1.3;
  const flick = 0.85 + Math.sin(t * 34) * 0.1 + Math.sin(t * 71) * 0.05;
  flame.scale.set(flick * 0.9, flameOn ? flick : 0.001, flick * 0.9);
  flameMat.opacity = flameOn ? 0.95 : 0;
  zLight.intensity = flameOn ? 1.5 * flick * (1 - sink) : 0;

  if (t > CATCH){
    emberMat.emissive.setHex(PAL.ember);
    emberMat.color.setHex(PAL.ember);
  }
  if (sink >= 1) zippo.visible = false;
}

// The room never changes. The fish starts as a backlit silhouette against the
// doorway and is lit by its own cigarette once it catches — the ember is the
// only thing that reaches its face. Everything after that is this timeline:
// light it, read the body on the floor, then leave through the door.
const FLOW = CONFIG.flow;
const BONE_LOOK = new THREE.Vector3(CONFIG.bones.pos[0], 0.06, CONFIG.bones.pos[2]);
let lookBones = false, whiteOut = 0, wispGrow = 0.35;

// The light isn't reliable. Every few seconds it stutters and the room drops
// most of the way to black for a handful of frames.
let flickWait = 3 + Math.random() * 5, flickAt = -1, flick = 1;
function updateFlicker(dt){
  if (lit && litT > FLOW.cam){ flick += (1 - flick) * 0.2; }
  else if (lit && litT < CATCH + 1.35){
    // the room drops out at the exact moment the cigarette catches, so for a
    // second the only thing lighting him is the thing in his mouth
    const p = litT - (CATCH - 0.16);
    flick = p < 0      ? 1
          : p < 0.12   ? 0.02
          : p < 0.2    ? 0.45
          : p < 0.95   ? 0.015
          : Math.min(1, (p - 0.95) / 0.4);
  }
  else {
    flickWait -= dt;
    if (flickWait <= 0 && flickAt < 0){ flickAt = 0; flickWait = 5 + Math.random() * 9; }
    if (flickAt >= 0){
      flickAt += dt;
      const p = flickAt;
      flick = p < 0.05 ? 0.04 : p < 0.09 ? 0.72 : p < 0.58 ? 0.02 : p < 0.64 ? 0.45
            : p < 0.78 ? 0.05 : 1;                    // a long beat of nothing
      if (p > 0.9){ flickAt = -1; flick = 1; }
    }
  }
  lightPanel.material.color.setScalar(flick);
  pool.material.color.setScalar(flick * 0.98);
  key.intensity = CONFIG.light.intensity * flick;
}

function updateFlow(dt){
  const target = lit ? Math.min(Math.max((litT - CATCH) / 1.1, 0), 1) : 0;
  bright += (smooth(target) - bright) * Math.min(1, dt * 3);
  fill.intensity = CONFIG.light.fill * bright;
  if (!lit) return;
  litT += dt;
  const t = litT;

  lookBones = t > FLOW.look;

  // takes a long look at what's left of the victim and stays with it
  if (!cornerMode){
    const dipIn = smooth(Math.min(Math.max((t - FLOW.look) / 0.9, 0), 1));
    head.rotation.z = -0.42 * dipIn;
  }

  // the smoke starts thin and builds
  wispGrow = Math.min(0.35 + (t - CATCH) * 0.09, 0.95);

  // the screen goes with the camera
  whiteOut = Math.min(Math.max((t - FLOW.white) / (FLOW.end - FLOW.white), 0), 1);
  if (whiteOut > 0){
    flashEl.style.transition = 'none';
    flashEl.style.opacity = String(whiteOut);
  }

  // the flight is already running under the white — the white just lets go of it
  if (t > FLOW.city && !cityMode) enterCity();
  if (cityMode){
    const f = Math.min(Math.max((t - FLOW.hold) / FLOW.fade, 0), 1);
    flashEl.style.transition = 'none';
    flashEl.style.opacity = String(1 - f);
    if (travelT >= 0){ updateTravel(dt); return; }
    updatePush(dt);
    if (uptownMode){ updateUptown(dt); Battle.update(dt); }
    else if (kitchenMode) updateKitchen(dt);
    else if (officeMode) updateOffice(dt);
    else if (cornerMode) updateCorner(dt);
    else updateCity(dt);
  }
}

/* ------------------------------------------------------------ facet normals */
scene.traverse(o => {
  if (o.isMesh && o.material && o.material.isMeshToonMaterial){
    if (o.geometry.index){
      const g = o.geometry.toNonIndexed();
      o.geometry.dispose();
      o.geometry = g;
    }
    o.geometry.computeVertexNormals();
  }
});

/* -------------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let elapsed = 0;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateFlow(dt);                    // owns the clock, and the city once we're there
  Menu.update();
  Battle.walk(dt);

  updateBoxText(dt);
  updateBoxIdle(dt);
  if (hintT >= 0){ hintT += dt; if (hintT > 9) dropHint(); }

  if (cornerMode || officeMode || kitchenMode || uptownMode){
    updateInput();
    updateFish(dt);
    updateWisps(dt, elapsed);
    updateLook(dt);
    trackEye(eyeR, 1, dt);
    trackEye(eyeL, -1, dt);
    emberMat.emissiveIntensity = 1.3 + Math.sin(elapsed * 2.1) * 0.12;
    cigGlow.intensity = 1.1;
  } else if (!cityMode){
    updateFish(dt);
    updateCamera(dt);
    updateZippo(dt);
    updateFlicker(dt);
    updateLook(dt);
    trackEye(eyeR, 1, dt);
    trackEye(eyeL, -1, dt);
    updateWisps(dt, elapsed);

    // ember breathes when it takes a drag
    if (emerFlash > 0) emerFlash -= dt;
    if (lit && litT > CATCH){
      emberMat.emissiveIntensity = 1.3 + (emerFlash > 0 ? 1.6 * emerFlash : 0) + Math.sin(elapsed*2.1)*0.12;
      cigGlow.intensity = (1.25 + (emerFlash > 0 ? 0.8 * emerFlash : 0)) * bright;
    }

    // dust drift
    const dp = window.__dust.geometry.attributes.position;
    for (let i = 0; i < dp.count; i++){
      let y = dp.getY(i) + dt * 0.055;
      if (y > 7.4) y = -0.2;
      dp.setY(i, y);
      dp.setX(i, dp.getX(i) + Math.sin(elapsed*0.35 + i) * dt * 0.02);
    }
    dp.needsUpdate = true;

    // titles drifting in space
    const T = elapsed * MO;
    for (const name of ['something','fishy']){
      const w = words[name], c = w.cfg;
      const a = name === 'something' ? 0 : 2.1;
      const rotY = c.rotY + Math.sin(T*0.16 + a) * 0.045;
      const shear = [c.shear[0], c.shear[1]];
      const pos = [...c.pos];
      pos[1] += Math.sin(T*0.24 + a) * 0.05;
      pos[0] += Math.sin(T*0.13 + a) * 0.06;
      setSkew(w.mesh, pos, rotY, shear);
    }
  }

  if (rt){
    const want = officeMode ? CONFIG.ripple.corner
               : cornerMode ? CONFIG.ripple.corner
               : cityMode ? CONFIG.ripple.city : CONFIG.ripple.room;
    rippleAmt += (want - rippleAmt) * Math.min(1, dt * CONFIG.ripple.ease);
    fxMat.uniforms.uTime.value = elapsed;
    fxMat.uniforms.uAmt.value = rippleAmt;
    const play2 = cornerMode || officeMode || kitchenMode || uptownMode;
    const conWant = play2 ? CONFIG.grade.con : 1;
    const liftWant = play2 ? CONFIG.grade.lift : 0;
    fxMat.uniforms.uCon.value += (conWant - fxMat.uniforms.uCon.value) * Math.min(1, dt * 1.2);
    fxMat.uniforms.uLift.value += (liftWant - fxMat.uniforms.uLift.value) * Math.min(1, dt * 1.2);
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(fxScene, fxCam);
  } else {
    renderer.render(scene, camera);
  }
}

resize();
makeRipple();
rippleAmt = CONFIG.ripple.room;
// give the textures a beat to decode before the screen comes up
setTimeout(() => { loadEl.classList.add('hide'); setTimeout(()=>loadEl.remove(), 700); }, 500);
frame();
</script>
